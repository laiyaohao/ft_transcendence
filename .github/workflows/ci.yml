name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run the disposable, offline browser suite daily without making pull
    # requests wait for a Docker-backed end-to-end environment.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, grading-service, learning-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify ${{ matrix.service }}
        run: ./backend/auth-service/mvnw -f backend/${{ matrix.service }}/pom.xml verify
      - name: Package ${{ matrix.service }}
        run: ./backend/auth-service/mvnw -f backend/${{ matrix.service }}/pom.xml package -DskipTests

  containers:
    name: Compose configuration and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example build

  offline-e2e:
    # The fixture stack is intentionally a post-merge/nightly/manual check
    # until its duration and reliability are proven on hosted runners.
    if: github.event_name != 'pull_request'
    name: Offline E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Install frontend test dependencies
        run: npm --prefix frontend ci
      - name: Install supported Chrome and its Playwright dependencies
        run: npx --prefix frontend playwright install --with-deps chrome
      - name: Start the disposable offline fixture stack
        run: >-
          docker compose --env-file compose.e2e.env
          -f compose.yaml -f compose.e2e.yaml --profile e2e
          up --build --wait --wait-timeout 180
      - name: Run offline browser workflows
        run: npm --prefix frontend run test:e2e:ci
      - name: Collect fixture-stack diagnostics
        if: always()
        run: >-
          docker compose --env-file compose.e2e.env
          -f compose.yaml -f compose.e2e.yaml --profile e2e
          logs --no-color > e2e-compose.log || true
      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-compose.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the disposable fixture stack and volumes
        if: always()
        run: >-
          docker compose --env-file compose.e2e.env
          -f compose.yaml -f compose.e2e.yaml --profile e2e
          down --volumes --remove-orphans
