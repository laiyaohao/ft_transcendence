# Production-only overlay. Keep compose.yaml for local development and the E2E
# overlay. Start this topology with both files; it publishes only the Nginx edge.
#
# docker compose --env-file .env --env-file .env.production \
#   -f compose.yaml -f compose.production.yaml up --build -d
services:
  postgres:
    ports: !reset []
    networks: [application]

  # Adminer is deliberately opt-in in production and is never published. Use it
  # only during a controlled, private maintenance session.
  adminer:
    ports: !reset []
    profiles: [maintenance]
    networks: [application]

  auth-service:
    ports: !reset []
    networks: [application]
    environment:
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?Set FRONTEND_ALLOWED_ORIGINS to the public HTTPS origin}
      SECURITY_HEADERS_HSTS_ENABLED: ${SECURITY_HEADERS_HSTS_ENABLED:-false}

  grading-service:
    ports: !reset []
    networks: [application]
    environment:
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?Set FRONTEND_ALLOWED_ORIGINS to the public HTTPS origin}
      SECURITY_HEADERS_HSTS_ENABLED: ${SECURITY_HEADERS_HSTS_ENABLED:-false}

  learning-service:
    ports: !reset []
    networks: [application]
    environment:
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?Set FRONTEND_ALLOWED_ORIGINS to the public HTTPS origin}
      SECURITY_HEADERS_HSTS_ENABLED: ${SECURITY_HEADERS_HSTS_ENABLED:-false}

  frontend:
    ports: !reset []
    networks: [application]
    build:
      args:
        # Nginx strips the prefix before forwarding to the respective service.
        NEXT_PUBLIC_API_URL: /auth
        NEXT_PUBLIC_LEARNING_API_URL: /learning
        NEXT_PUBLIC_GRADING_API_URL: /grading
        ENFORCE_HTTPS: "true"
    environment:
      NEXT_PUBLIC_API_URL: /auth
      NEXT_PUBLIC_LEARNING_API_URL: /learning
      NEXT_PUBLIC_GRADING_API_URL: /grading
      ENFORCE_HTTPS: "true"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      grading-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Limit the official Nginx image's template substitution to this one
      # value. This preserves Nginx variables such as $host and $remote_addr.
      NGINX_ENVSUBST_FILTER: PUBLIC_APP_DOMAIN|SECURITY_HEADERS_HSTS_ENABLED
      PUBLIC_APP_DOMAIN: ${PUBLIC_APP_DOMAIN:?Set PUBLIC_APP_DOMAIN to the public DNS hostname}
      SECURITY_HEADERS_HSTS_ENABLED: ${SECURITY_HEADERS_HSTS_ENABLED:-false}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${TLS_CERT_PATH:?Set TLS_CERT_PATH to the PEM certificate chain on the host}
        target: /etc/nginx/tls/tls.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_PATH:?Set TLS_KEY_PATH to the PEM private key on the host}
        target: /etc/nginx/tls/tls.key
        read_only: true
    networks: [application]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

# This named bridge is private to this Compose project: no application service
# is published to the host. It is intentionally not Docker `internal: true`,
# because grading-service needs controlled egress to its configured AI provider.
networks:
  application:
    name: ${COMPOSE_PROJECT_NAME:-lumina}_application
    driver: bridge
