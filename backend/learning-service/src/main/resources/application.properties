spring.application.name=learning-service
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${LEARNING_DB_URL}
spring.datasource.username=${LEARNING_DB_USERNAME}
spring.datasource.password=${LEARNING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${LEARNING_DB_SCHEMA:learning}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${LEARNING_DB_SCHEMA:learning}
spring.flyway.schemas=${LEARNING_DB_SCHEMA:learning}
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Auth and learning services validate the same signed identity contract.
jwt.secret=${JWT_SECRET}

# Shared only by grading-service and learning-service; never expose to the frontend.
learning.marking-sync-key=${LEARNING_MARKING_SYNC_KEY}

server.port=8083
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Browser origins and TLS are deployment concerns; no production origin is hard-coded here.
security.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:false}
