spring.application.name=grading-service
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Server configuration
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=${GRADING_DB_URL}
spring.datasource.username=${GRADING_DB_USERNAME}
spring.datasource.password=${GRADING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only verifies entity compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${GRADING_DB_SCHEMA:grading}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${GRADING_DB_SCHEMA:grading}
spring.flyway.schemas=${GRADING_DB_SCHEMA:grading}
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Auth-service and grading-service validate the same signed identity contract.
jwt.secret=${JWT_SECRET}

# External AI provider configuration
ai.engine.url=${AI_ENGINE_URL}
ai.engine.model=${AI_ENGINE_MODEL}
ai.engine.api-key=${AI_ENGINE_API_KEY}
ai.vision.model=${AI_VISION_MODEL}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
