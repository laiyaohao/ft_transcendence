# .codex/config.toml

# Main session / engineering controller
model = "gpt-5.6-terra"
model_reasoning_effort = "high"

# Safe default for normal development
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Main agent + up to 4 spawned workers
max_concurrent_threads_per_session = 4